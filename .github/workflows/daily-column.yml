name: Daily column

# 毎日 09:17 JST（00:17 UTC）に content/columns/topics.json から1本生成して main に直接コミットする。
# 必要な設定:
#   Secrets: ANTHROPIC_API_KEY
#   Variables: NEXT_PUBLIC_SITE_URL（ビルド検証用。未設定でもビルドは通る）
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "生成するトピックの slug（省略時は未作成の先頭）"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-column
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate column
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            node scripts/generate-column.mjs --topic "${{ github.event.inputs.topic }}"
          else
            node scripts/generate-column.mjs
          fi

      - name: Validate content
        run: node scripts/validate-content.mjs

      - name: Type check and build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          npx tsc --noEmit
          npm run build

      - name: Commit and push
        run: |
          if git diff --quiet -- content/columns; then
            echo "no changes"
            exit 0
          fi
          git config user.name "column-bot"
          git config user.email "column-bot@users.noreply.github.com"
          git add content/columns
          git commit -m "column: 自動生成 $(date -u +%Y-%m-%d)"
          git push
